<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t("site.title") }}{% endblock %}</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="{{ t('meta.description') }}">
<meta property="og:title" content="{{ self.title() | striptags | trim }}">
<meta property="og:description" content="{{ t('meta.description') }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{ og_locale }}">
<meta property="og:url" content="{{ abs_url(page_urls[lang]) }}">
<meta property="og:image" content="{{ abs_url(og_image) }}">
<meta property="og:image:width" content="{{ og_image_size[0] }}">
<meta property="og:image:height" content="{{ og_image_size[1] }}">
<meta property="og:image:alt" content="{{ t('meta.image_alt') }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" hreflang="de" href="{{ page_urls.de }}">
<link rel="alternate" hreflang="en" href="{{ page_urls.en }}">
<link rel="alternate" hreflang="x-default" href="{{ page_urls.de }}">
{% block head %}{% endblock %}
</head>
<body>
<a class="skip-link" href="#main">{{ t("nav.skip") }}</a>
<header class="site-header">
<a class="site-title" href="{{ url('index.html') }}">{{ t("site.title") }}</a>
<nav aria-label="{{ t('nav.label') }}">
<a href="{{ url('index.html') }}">{{ t("nav.home") }}</a>
<a href="{{ url('map.html') }}">{{ t("nav.map") }}</a>
<a href="{{ url('methodology.html') }}">{{ t("nav.methodology") }}</a>
</nav>
<a class="lang-switch" href="{{ counterpart_url }}" hreflang="{{ counterpart_lang }}" lang="{{ counterpart_lang }}">{{ t("lang.switch") }}</a>
</header>
<main id="main">
{% block content %}{% endblock %}
</main>
<footer>
<a href="{{ url('impressum.html') }}">{{ t("nav.impressum") }}</a>
<a href="{{ url('datenschutz.html') }}">{{ t("nav.privacy") }}</a>
</footer>
</body>
</html>
