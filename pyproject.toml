[project]
name = "berlinbikes"
version = "0.1.0"
description = "Snapshot collector and availability analysis for Berlin bike-share systems"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/berlinbikes"]
